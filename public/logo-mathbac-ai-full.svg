<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1ff"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#bcd0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bcd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- icone -->
  <g transform="translate(10,10) scale(0.9)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#ffffff" opacity="0.04"/>

    <ellipse cx="100" cy="120" rx="46" ry="8" fill="#0a0a1a" opacity="0.12"/>
    <polygon points="100,52 158,80 100,108 42,80" fill="url(#capShade)"/>
    <polygon points="100,52 158,80 100,90 42,80" fill="#ffffff" opacity="0.55"/>
    <rect x="76" y="86" width="48" height="30" rx="7" fill="url(#capShade)"/>
    <circle cx="100" cy="80" r="5" fill="#4f6ef7"/>
    <path d="M 100 80 C 118 84, 128 96, 128 112" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="129" cy="118" r="16" fill="url(#nodeGlow)"/>
    <circle cx="129" cy="118" r="7" fill="#ffffff"/>
    <circle cx="129" cy="118" r="7" fill="none" stroke="#4f6ef7" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <text x="228" y="132" font-family="Archivo Black" font-size="84" letter-spacing="-1">
    <tspan fill="#ffffff">Math</tspan><tspan fill="url(#textGrad)">Bac</tspan><tspan fill="#ffffff">.AI</tspan>
